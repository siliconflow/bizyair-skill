  <text x="64" y="392" fill="#7E90B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Plus more models, AI apps, and workflows.</text>
  <text x="1136" y="392" text-anchor="end" fill="#FFFFFF" fill-opacity="0.28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.2">BIZYAIR.AI</text>
</svg>
